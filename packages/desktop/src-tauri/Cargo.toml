[package]
name = "emberlink"
version = "0.1.0"
description = "Emberlink — one-time secret sharing (desktop creator app)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "emberlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
